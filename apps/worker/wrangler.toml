name = "shila-worker"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

# Model provider selection. Adapters live in src/llm.
# Secrets (set via `wrangler secret put` or `.dev.vars`):
#   DEEPSEEK_API_KEY, OPENAI_API_KEY
[vars]
SHILA_MODEL_PROVIDER = "deepseek"

[[d1_databases]]
binding = "DB"
database_name = "shila-db"
# Placeholder id: local `wrangler dev` / tests use a Miniflare-backed D1 and do
# not validate this. Replace with the real id after `wrangler d1 create shila-db`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
